name: Build Android Geode mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}

      - name: Validate Geode package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(output/*.geode)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .geode package, found ${#packages[@]}."
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          package="${packages[0]}"
          test -s "$package"
          unzip -t "$package"
          echo "Package: $package"
          echo "Size: $(stat -c%s "$package") bytes"
          unzip -l "$package"
          if ! unzip -Z1 "$package" | grep -Eq '(^|/)mod\.json$'; then
            echo "::error::The .geode package does not contain mod.json."
            exit 1
          fi

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: ArtAgentMobile-${{ matrix.target }}-v0.9.1
          path: output/*.geode
          if-no-files-found: error
