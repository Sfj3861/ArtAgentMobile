name: Build C to Triggers Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p launcher :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-to-triggers-launcher-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
